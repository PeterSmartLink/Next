name: Build private Next owner APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-private-release
  cancel-in-progress: false

jobs:
  private_release:
    name: Build signed owner APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Require private signing secrets
        env:
          NEXT_KEYSTORE_BASE64: ${{ secrets.NEXT_KEYSTORE_BASE64 }}
          NEXT_KEY_ALIAS: ${{ secrets.NEXT_KEY_ALIAS }}
          NEXT_KEY_PASSWORD: ${{ secrets.NEXT_KEY_PASSWORD }}
          NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$NEXT_KEYSTORE_BASE64" "$NEXT_KEY_ALIAS" "$NEXT_KEY_PASSWORD" "$NEXT_STORE_PASSWORD"; do
            test -n "$value"
          done

      - name: Validate private signing material
        env:
          NEXT_KEYSTORE_BASE64: ${{ secrets.NEXT_KEYSTORE_BASE64 }}
          NEXT_KEY_ALIAS: ${{ secrets.NEXT_KEY_ALIAS }}
          NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=android/app/next-owner-release.check.jks
          trap 'rm -f "$keystore"' EXIT
          if ! printf '%s' "$NEXT_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo "::error::NEXT_KEYSTORE_BASE64 is not valid Base64. Use the complete Base64 content of the .jks file exactly, including any ending = characters."
            exit 1
          fi
          if ! test -s "$keystore"; then
            echo "::error::NEXT_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$NEXT_STORE_PASSWORD" -alias "$NEXT_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The Next keystore, alias, or store password does not match. Check NEXT_KEYSTORE_BASE64, NEXT_KEY_ALIAS, and NEXT_STORE_PASSWORD."
            exit 1
          fi

      - name: Prepare ephemeral signing files
        env:
          NEXT_KEYSTORE_BASE64: ${{ secrets.NEXT_KEYSTORE_BASE64 }}
          NEXT_KEY_ALIAS: ${{ secrets.NEXT_KEY_ALIAS }}
          NEXT_KEY_PASSWORD: ${{ secrets.NEXT_KEY_PASSWORD }}
          NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$NEXT_KEYSTORE_BASE64" | base64 --decode > android/app/next-owner-release.jks
          cat > android/key.properties <<EOF
          storePassword=$NEXT_STORE_PASSWORD
          keyPassword=$NEXT_KEY_PASSWORD
          keyAlias=$NEXT_KEY_ALIAS
          storeFile=next-owner-release.jks
          EOF
          chmod 600 android/key.properties android/app/next-owner-release.jks

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify private APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK"
          du -h "$APK"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/next-owner-release.jks

      - name: Keep private APK briefly
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: next-owner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
